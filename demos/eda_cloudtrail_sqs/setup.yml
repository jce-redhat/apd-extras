---
controller_templates:
  - name: EDA | EC2 Instance Post-provisioning
    job_type: run
    inventory: Ansible Product Demos Inventory
    credentials:
      - APD Machine Credential
      - AWS
    project: APD Extras
    playbook: demos/eda_cloudtrail_sqs/ec2-post-provision.yml
    ask_variables_on_launch: true
    use_fact_cache: true
    allow_simultaneous: true

eda_credential_types:
  - name: Amazon Web Services
    description: AWS credential for EDA
    state: present
    inputs:
      fields:
        - id: username
          label: Access Key
          type: string
        - id: password
          label: Secret Key
          type: string
          secret: true
        - id: security_token
          label: STS Token
          type: string
          secret: true
          help_text: >-
            Security Token Service (STS) is a web service that enables you to request
            temporary, limited-privilege credentials for AWS Identity and Access
            Management (IAM) users.
      required:
        - username
        - password
    injectors:
      env:
        AWS_ACCESS_KEY_ID: !unsafe '{{ username }}'
        AWS_SECRET_ACCESS_KEY: !unsafe '{{ password }}'
        AWS_SESSION_TOKEN: !unsafe '{{ security_token }}'

eda_credentials:
  - name: AWS
    description: AWS credential for EDA rulebooks
    state: present
    credential_type: Amazon Web Services
    organization: Ansible Product Demos (APD)
    inputs:
      username: '{{ lookup("env","AWS_ACCESS_KEY_ID") | default("CHANGEME", true) }}'
      password: '{{ lookup("env","AWS_SECRET_ACCESS_KEY") | default("CHANGEME", true) }}'
      security_token: '{{ lookup("env","AWS_SESSION_TOKEN") | default(omit) }}'

eda_rulebook_activations:
  - name: Monitor SQS for new EC2 instances
    description: Monitor SQS queue for new EC2 instance events and run post-provisioning
    state: present
    organization: Ansible Product Demos (APD)
    project: APD Extras
    rulebook: sqs-new-instances.yml
    decision_environment: APD Default DE
    eda_credentials:
      - AAP Credential for EDA
      - AWS
    extra_vars:
      sqs_queue_name: apd-cloudtrail-queue
      sqs_queue_region: '{{ monitoring_aws_region | default("us-east-2") }}'
    restart_policy: on-failure
    log_level: info

...
# vim: ft=yaml.ansible
