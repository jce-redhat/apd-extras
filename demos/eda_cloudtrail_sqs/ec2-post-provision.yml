---
- name: Look up EC2 instances from CloudTrail events and add to inventory
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Extract instance details from CloudTrail events
      ansible.builtin.set_fact:
        instance_details: >-
          {{ (instance_details | default([])) +
             (item.body.detail.responseElements.instancesSet['items']
              | map('dict2items')
              | map('selectattr', 'key', 'in', ['instanceId', 'imageId', 'privateIpAddress', 'subnetId'])
              | map('items2dict')
              | list) }}
        aws_region: "{{ item.body.detail.awsRegion }}"
      loop: "{{ instance_events }}"
      loop_control:
        label: "{{ item.body.detail.eventID }}"

    - name: Query EC2 instance information
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids: "{{ instance_details | map(attribute='instanceId') | list }}"
      register: _instance_info

    - name: Add instances to new_ec2_instances group
      ansible.builtin.add_host:
        name: "{{ item.tags.Name | default('instance') }}-{{ item.instance_id }}"
        groups: new_ec2_instances
        ansible_host: "{{ item.public_ip_address | default(item.private_ip_address) }}"
        ansible_user: ec2-user
      loop: "{{ _instance_info.instances }}"
      loop_control:
        label: "{{ item.instance_id }}"

- name: Post-provision configuration of new EC2 instances
  hosts: new_ec2_instances
  gather_facts: false

  tasks:
    - name: Wait for instance to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

...
